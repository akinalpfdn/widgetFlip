<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget Flip — English iPad App Store Screenshots</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#252525}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
:root{--gold:#efc77f;--cream:#f4efe4;--dark:#111315;--ink:#202422}
.shot{width:2048px;height:2732px;position:relative;overflow:hidden;isolation:isolate;background:var(--dark);color:var(--cream)}
.shot.light{background:var(--cream);color:var(--ink)}
.brand{position:absolute;top:104px;left:126px;display:flex;align-items:center;gap:24px;font-size:50px;font-weight:600;letter-spacing:-1px;z-index:10}
.brand img{width:76px;height:76px;border-radius:20px}
.copy{position:absolute;left:126px;right:100px;top:265px;z-index:5}
h1{font-size:172px;line-height:1.04;letter-spacing:-7px;font-weight:730;margin:0}h1 span{color:var(--gold)}
.light h1 span{color:#967035}
p{font-size:96px;line-height:1.2;font-weight:600;letter-spacing:-1.8px;margin:44px 0 0;color:#ece9e2}.light p{color:#373b35}
.tablet{position:absolute;padding:12px;background:linear-gradient(130deg,#858984 0%,#2d302e 14%,#77796f 41%,#222526 70%,#6d7169 100%);border-radius:66px;box-shadow:0 50px 95px #0006,0 2px 0 #ffffff80 inset;z-index:2}
.tablet::after{content:"";position:absolute;inset:5px;border:2px solid #ffffff30;border-radius:61px;pointer-events:none}
.screen{width:100%;border:22px solid #070808;border-radius:55px;overflow:hidden;background:#000}
.screen img{display:block;width:100%;height:auto}
.widget{position:absolute;object-fit:contain;filter:drop-shadow(0 24px 40px #0005);z-index:4}
.widget.small{border-radius:22.5%}.widget.medium{border-radius:10% / 22%}.widget.large{border-radius:9.3%}
.caption{position:absolute;font-size:64px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#55584e}
.glow{position:absolute;width:2200px;height:2100px;border-radius:50%;background:radial-gradient(ellipse,#b184422a 0%,#a87b3712 40%,transparent 67%);z-index:-1;pointer-events:none}
#home .glow{left:-480px;top:600px}
#home .tablet{width:1200px;left:712px;top:990px;transform:rotate(3deg)}
#home .focus-widget{width:700px;left:125px;top:1500px;transform:rotate(-5deg);box-shadow:0 40px 70px #0007;border:1px solid #dcb47033}
#home .tap{position:absolute;left:220px;top:2300px;display:flex;align-items:center;gap:24px;color:var(--gold);font-size:80px;font-weight:600;transform:rotate(-5deg);z-index:5}
.tap svg{width:72px;height:72px}
#sizes .widget.large{left:126px;top:900px;width:850px;filter:drop-shadow(0 32px 35px #41382433)}
#sizes .widget.small{left:1390px;top:1165px;width:470px;filter:drop-shadow(0 22px 25px #41382433)}
#sizes .widget.medium{left:126px;top:1920px;width:1480px;filter:drop-shadow(0 32px 35px #41382433)}
#sizes .caption.large-label{left:134px;top:1795px}#sizes .caption.small-label{left:1398px;top:1680px}#sizes .caption.medium-label{left:134px;top:2615px}
#sizes .rule{display:none}
#history .glow{left:-40px;top:850px}
#history .tablet{width:1220px;left:414px;top:925px}
#history .history-panel{position:absolute;z-index:6;left:126px;top:2140px;width:1796px;padding:46px 35px 36px;background:#161719;border:1px solid #ffffff24;border-radius:48px;box-shadow:0 28px 65px #0009}
.history-panel .label{font-size:64px;font-weight:600;letter-spacing:3px;color:var(--gold);padding:0 12px 30px}
.history-panel img{width:100%;height:auto;display:block;border-radius:20px}
body.preview{display:flex;gap:24px;padding:24px;align-items:flex-start;width:max-content}
body.preview .shot{zoom:.18;border-radius:22px;box-shadow:0 14px 30px #0004}
body.single .shot{display:none}body.single .shot.selected{display:block}
</style>
</head>
<body class="preview">
<section class="shot" id="home" data-file="01-home-screen.png">
  <div class="brand"><img src="assets/icon.png" alt="">Widget Flip</div>
  <div class="copy"><h1>Flip a coin.<br>On your <span>Home Screen.</span></h1><p>Instant coin flip without<br>opening any app.</p></div>
  <div class="glow"></div>
  <div class="tablet"><div class="screen"><img src="assets/home-medium.png" alt="Widget Flip on the Home Screen"></div></div>
  <img class="widget small focus-widget" src="assets/widget-small.png" alt="Small interactive coin widget">
  <div class="tap"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 15V6a3 3 0 0 1 6 0v10l3-3a2 2 0 0 1 3 0l3 4c2 4 0 10-4 12H14c-3-1-5-4-7-7l-3-5a2 2 0 0 1 3-3l6 5"/></svg>Tap to flip</div>
</section>
<section class="shot light" id="sizes" data-file="02-widget-sizes.png">
  <div class="brand"><img src="assets/icon.png" alt="">Widget Flip</div>
  <div class="copy"><h1>Pick your<br><span>widget size.</span></h1><p>Made to fit your Home Screen.</p></div>
  <img class="widget large" src="assets/widget-large.png" alt="Large widget">
  <img class="widget small" src="assets/widget-small.png" alt="Small widget">
  <span class="caption large-label">Large</span><span class="caption small-label">Small</span>
  <img class="widget medium" src="assets/widget-medium.png" alt="Medium widget">
  <span class="caption medium-label">Medium</span><div class="rule"></div>
</section>
<section class="shot" id="history" data-file="03-flip-history.png">
  <div class="brand"><img src="assets/icon.png" alt="">Widget Flip</div>
  <div class="copy"><h1>Keep your<br><span>recent flips.</span></h1><p>See your latest heads and tails.</p></div>
  <div class="glow"></div>
  <div class="tablet"><div class="screen"><img src="assets/app.png" alt="Coin flip app with recent results"></div></div>
  <div class="history-panel"><div class="label">RECENT FLIPS</div><img src="assets/history.png" alt="Actual flip history, enlarged for detail"></div>
</section>

<script>
const chosen = new URLSearchParams(location.search).get('shot');
if(chosen){document.body.className='single';document.getElementById(chosen)?.classList.add('selected');}
</script>
</body>
</html>
